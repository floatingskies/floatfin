# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Live ISOs

on:
  schedule:
    # Rebuild the ISOs every 2 days at 09:00 UTC (after the daily image
    # builds at 07:00 UTC so the newest images are used).
    - cron: "0 9 */2 * *"
  workflow_dispatch:

env:
  REPO_OWNER: ${{ github.repository_owner }}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-iso
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ublue-float
            tag: stable
            label: Ublue-Float-Live
          - name: bluefin-float
            tag: latest
            label: Ublue-Bluefin-Live
          - name: bazzite-float
            tag: latest
            label: Ublue-Bazzite-Live
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true

      - name: Mount Container Storage Loopback
        run: |
          # ext4, not btrfs. The images now bake hardlink-heavy Flatpaks, and
          # extracting those layers onto a btrfs filesystem fails with
          # "processing tar file(too many links)" (EMLINK) because of btrfs's
          # per-inode hardlink limit. ext4 handles the same hardlink farms.
          sudo truncate -s 120G /mnt/podman-storage.img
          sudo mkfs.ext4 -F -E nodiscard /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o discard,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          # Don't hardlink-dedupe identical files across image layers while
          # unpacking. The baked Flatpaks + rechunked layers contain "hardlink
          # farms" (e.g. yum/rpm metadata files with identical content across
          # every layer), and dedup collapses them onto a single inode whose
          # link count climbs past ext4's 65000 / btrfs's 65535 limit, killing
          # the build with "processing tar file(too many links): exit status 1".
          # With dedup disabled each layer is materialized as ordinary copies.
          sudo tee /etc/containers/storage.conf >/dev/null <<'EOF'
[storage]
driver = "overlay"
[storage.options]
# materialize files instead of hard-linking them against identical files that
# already exist in storage (string bool, cannot be a plain TOML boolean)
use_hard_links = "false"
[storage.options.pull_options]
use_hard_links = "false"
EOF
          sudo systemctl start podman.service

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The image registry name must be lower-case, but GitHub usernames can be capitalized.
      - name: Get lower-case equivalent of the repository owner's username
        id: repo_owner_case
        run: echo "lowercase=${REPO_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build Container Image
        run: |
          IMAGE="ghcr.io/${{ steps.repo_owner_case.outputs.lowercase }}/${{ matrix.name }}:${{ matrix.tag }}"
          # v2: fresh cache namespace. The old ublue-iso-cache-* repos carry
          # accumulated layers that fail to unpack ("too many links"); delete
          # them under Settings → Packages once the v2 builds succeed.
          CACHE_REPO="ghcr.io/${{ steps.repo_owner_case.outputs.lowercase }}/ublue-iso-cache-${{ matrix.name }}-${{ matrix.tag }}-v2"
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          # note: buildah's cache flags take a bare repository reference (no
          # tag/digest and no BuildKit "type=registry,ref=...,mode=max" syntax),
          # so keep each matrix row's cache in its own repo name
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --cache-from "$CACHE_REPO" \
            --cache-to "$CACHE_REPO" \
            --build-arg BASE_IMAGE="$IMAGE" \
            --build-arg INSTALL_IMAGE_PAYLOAD="$IMAGE" \
            --build-arg ISO_LABEL="${{ matrix.label }}" \
            -t localhost/payload:latest installer/

      - name: Show disk space
        if: always()
        run: |
          sudo df -h
          sudo du -sh /mnt/podman-storage.img

      - name: Build ISOs
        # Pin to the exact revamp-pr commit (7737f47) for reproducible ISO
        # builds instead of following the moving branch.
        uses: Zeglius/titanoboa@7737f4748458252ac827dca14b3d6dd09298472a
        id: build
        with:
          image-ref: localhost/payload:latest
          iso-dest: ${{ matrix.name }}-${{ matrix.tag }}-live-amd64.iso

      - name: Move ISOs to Upload Directory
        id: upload-directory
        shell: bash
        run: |
          ISO_UPLOAD_DIR=${{ github.workspace }}/upload
          ISO_PATH=${{ steps.build.outputs.iso-dest }}
          ISO_NAME=$(basename ${ISO_PATH})

          mkdir -p ${ISO_UPLOAD_DIR}
          mv ${ISO_PATH} ${ISO_UPLOAD_DIR}
          (cd ${ISO_UPLOAD_DIR} && sha256sum ${ISO_NAME} | tee ${ISO_NAME}-CHECKSUM)
          echo "iso-upload-dir=${ISO_UPLOAD_DIR}" >> $GITHUB_OUTPUT

      - name: Upload ISOs and Checksum to Job Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ matrix.tag }}-live
          path: ${{ github.workspace }}/upload
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true