# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: floatfin-silverblue
# description will be included in the image's metadata
description: >-
  Floatfin on stock Fedora Silverblue — the backup edition. If Bluefin (or any
  Universal Blue base) ever goes away, rebase here: the same customizations,
  one Fedora release behind. latest/stable track Silverblue 44, gts stays on 43.
alt-tags:
  - latest
  - stable

# the base image to build on top of (FROM) and the version tag to use
# Stock Fedora Silverblue — the same variant Bluefin is derived from.
# (The A/B desktop variant images live on quay.io — fedora-silverblue on
# registry.fedoraproject.org does not exist.)
base-image: quay.io/fedora-ostree-desktops/silverblue
image-version: 44

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files  # Pre-seed the ublue-os COPR repos (stock Silverblue has none)
    files:
      - source: repos
        destination: /etc/yum.repos.d
  - from-file: features/system-files.yml
  - from-file: features/application-rpms.yml
  - from-file: features/vscode.yml
  - from-file: features/devops.yml
  - from-file: features/docker.yml
  - from-file: features/cockpit.yml
  - from-file: features/virtualization.yml
  - from-file: features/fonts.yml
  - from-file: features/gnome-ui-fixes-from-bluefin.yml
  - from-file: features/gnome-ui-fixes.yml
  - from-file: features/gaming.yml
  - from-file: features/steam.yml
  - from-file: features/nix.yml
  - from-file: features/terminal.yml
  - from-file: features/wallpapers.yml
  - from-file: features/silverblue-overrides.yml
  - type: gschema-overrides  # Float defaults: Fira Code monospace + Firewatch wallpaper
    include:
      - zz42-float.gschema.override
      - zz999-float-bluefin-wallpaper.gschema.override
  - type: initramfs  # Regenerate initramfs so the plymouth spinner theme + pixmaps changes are baked in