# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
# The only wallpapers this image ships are the hand-picked `floatfin` set
# baked in via system-files. Everything else — stock GNOME, Fedora releases,
# KDE/Plasma — is purged at build time and GNOME's picker is repointed at the
# floatfin collection.
modules:
  - type: script
    scripts:
      - install-floatfin-wallpapers.sh