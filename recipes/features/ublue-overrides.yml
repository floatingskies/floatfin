# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
modules:
- type: files
  files:
    - source: dconf-ublue
      destination: /etc/dconf/db/distro.d
- type: dnf
  repos:
    files:
      - ublue-os-staging.repo
      - ublue-os-packages.repo
  install:
    packages:
      # These are generally packages from Bluefin (DX)
      # that we want, but aren't in the Silverblue image
      - ublue-polkit-rules
      - ublue-os-signing
      - ublue-brew
      - ublue-setup-services  
      - setools-console
      - lm_sensors
      - firewall-config
      - uupd
      - bcache-tools
      - git-credential-libsecret
      - openssh-askpass
      - rclone
      - restic
      - powertop
      - waypipe
  remove:
    packages:
      - gnome-software
- type: systemd
  system:
    enable:
      - uupd.timer
    disable:
      - rpm-ostreed-automatic.timer
      - flatpak-system-update.timer