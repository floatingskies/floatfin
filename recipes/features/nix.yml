# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
# Nix / nixpkgs, integrated with Fedora's official Nix packaging. Nix landed
# in the Fedora repos (not EPEL) with Atomic-aware packages (nix-filesystem,
# nix-system handle the /nix store + mount layout on immutable roots), so this
# stays inside the "stock Fedora repos only" rule. `skip-unavailable` keeps the
# multi-channel builds from failing if a given Fedora release lags behind.
# setup-nix.sh enables the (socket-activated) daemon and turns flakes on.
modules:
  - type: dnf
    install:
      skip-unavailable: true
      packages:
        - nix-core
        - nix-legacy
        - nix-daemon
        - nix-filesystem
        - nix-system
  - type: script
    scripts:
      - setup-nix.sh