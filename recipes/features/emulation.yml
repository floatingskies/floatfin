# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json

# RetroArch + the libretro cores Fedora ships, plus standalone emulators
# for NES, SNES, GB/GBC, GBA and Mega Drive/Genesis. All from Fedora main.
modules:
  - type: dnf
    install:
      packages:
        - retroarch
        - retroarch-assets
        - retroarch-filters
        - retroarch-database
        - libretro-nestopia
        - libretro-mgba
        - libretro-gambatte
        - mednafen
        - visualboyadvance-m