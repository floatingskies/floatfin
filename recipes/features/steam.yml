# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json

# Steam client from RPM Fusion non-free. Bluefin does not ship it and
# Bazzite already does, so this feature is only wired into the Bluefin images.
modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        - steam