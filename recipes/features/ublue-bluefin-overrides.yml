# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
modules:
- type: files
  files:
  - source: dconf-bluefin
    destination: /etc/dconf/db/distro.d
- type: systemd
  system:
    enable:
    # Remote admin out of the box: web console, socket-activated SSH
    # (zero idle RAM, spawns sshd on connect) and the docker-compatible
    # podman API socket.
    - cockpit.socket
    - sshd.socket
    - podman.socket
    disable:
    # Disable VPNs we don't use
    - tailscaled
    # Disable the abomination known as rootful Docker
    - docker.service
    - docker.socket

- type: script
  snippets:
  # Disable Starship by default
  - "sed -i '/starship init bash/d' /etc/bashrc"