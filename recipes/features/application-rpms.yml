# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
modules:
  - type: dnf
    install:
      packages:
        - langpacks-en
        - nss-tools
        - socat
        - gnome-shell-extension-system-monitor-applet
        - netcat
        - fastfetch
        - clinfo
        - firefox
        # GNOME default apps (native RPMs, not flatpaks)
        - gnome-text-editor
        - loupe
        # Remote admin: sshd.socket is enabled in ublue-bluefin-overrides,
        # so the server must already be present when that runs.
        - openssh-server
  # VLC from negativo17's multimedia repo: fully-featured build matching the
  # other negativo17 packages (Steam/gaming) already in the image.
  - type: dnf
    repos:
      files:
        - https://negativo17.org/repos/fedora-multimedia.repo
      keys:
        - https://negativo17.org/repos/RPM-GPG-KEY-slaanesh
    install:
      skip-unavailable: true
      packages:
        - vlc