# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
# Dev-ops / sysadmin / web-dev / Linux-enthusiast CLI toolkit. Everything here
# is available in the stock Fedora repos, so the image keeps working across
# repo and Fedora version bumps with no third-party repos to babysit.
# `skip-unavailable` keeps the multi-channel builds (gts/stable/latest span
# several Fedora releases) from failing if one tool isn't packaged yet.
modules:
  - type: dnf
    install:
      skip-unavailable: true
      packages:
        # dev-ops & automation
        - ansible-core
        - gh
        - git-lfs
        - jq
        - yq
        - shellcheck
        - sshpass
        # sysadmin / diagnostics
        - bind-utils
        - htop
        - iotop
        - iperf3
        - lsof
        - mtr
        - ncdu
        - net-tools
        - nmap
        - psmisc
        - strace
        - sysstat
        - tcpdump
        - tmux
        - tree
        - whois
        - wget
        # system health / storage
        - smartmontools
        # terminal-power-user essentials
        - bat
        - btop
        - chafa
        - duf
        - eza
        - fd-find
        - fzf
        - ImageMagick-libs
        - pv
        - ripgrep
        # file transfer / archives
        - rsync
        - zip
        - unzip
        - p7zip
        # containers (dnf/OCI toolchain)
        - buildah
        - skopeo
        - podman-compose
        # web development
        - nodejs
        - npm
        - python3-pip
        - util-linux-user