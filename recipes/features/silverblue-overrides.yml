# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
# Silverblue-specific overrides for the backup edition.
#
# The Bluefin overrides (ublue-bluefin-overrides.yml) disable docker.service,
# docker.socket and tailscaled — those units don't exist on a stock Fedora
# Silverblue base, and blue-build's systemd module hard-fails when asked to
# disable a unit that isn't installed. This file only touches units that exist
# on Silverblue: enable the same socket-activation we use elsewhere, and stop
# the two automatic-update units Bluefin images ship disabled.
modules:
  - type: files
    files:
      # Same GNOME defaults as every other edition (dock, favorites, file
      # manager prefs, dconf-update-service integration).
      - source: dconf-bluefin
        destination: /etc/dconf/db/distro.d
  - type: systemd
    system:
      enable:
        - cockpit.socket  # web admin UI (installed by cockpit feature)
        - sshd.socket     # on-demand SSH (openssh-server from application-rpms)
        - podman.socket   # rootless podman API (native to Silverblue)
      disable:
        - rpm-ostreed-automatic.timer
        - flatpak-system-update.timer