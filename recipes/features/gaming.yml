# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
# Gaming optimizations layered on top of Steam (flavor of the image decides
# whether Steam itself is present). GameMode shifts the CPU governor and I/O
# priority while running; Gamescope is the micro-compositor with FSR, fps caps
# and HDR; Mangohud draws the performance overlay. Vulkan tooling and 7z round
# it out for Proton / Windows game archives.
modules:
  - type: dnf
    repos:
      nonfree: negativo17
    install:
      skip-unavailable: true
      packages:
        - gamemode
        - gamemode-libs
        - gamescope
        - mangohud
        - mangohud.i686
        - vulkan-tools
        - p7zip-plugins