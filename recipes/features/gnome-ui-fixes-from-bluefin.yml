# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
# Note: this should not be used with the Universal Blue end-user images, since they 
# have switched from shipping Gnome extensions in RPMs from Fedora
modules:
  - type: dnf
    # Repos pre-seeded by the image: ublue-os/staging + ublue-os/packages
    # COPRs (Silverblue recipes install files/repos/*.repo; the Bluefin base
    # already ships them). Don't re-add them here — a duplicate repo id
    # hard-fails the build.
    install:
      packages:    
        - gnome-shell-extension-appindicator
        - gnome-tweaks