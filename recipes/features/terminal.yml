# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
# Terminal-first comfort layer: a curated fish setup (starship prompt, eza /
# bat / rg / zoxide aliases, system shortcuts), Fira Code terminal font, and
# the `float` wizard + cheatsheet that walks beginners -> intermediates ->
# power users. All packages are stock Fedora, skip-unavailable keeps the
# multi-channel matrix building. The config files ship via system-files.yml
# (files/system -> /); there is deliberately no setup script here.
modules:
  - type: dnf
    install:
      skip-unavailable: true
      packages:
        - fish
        - starship
        - zoxide
        - fira-code-fonts