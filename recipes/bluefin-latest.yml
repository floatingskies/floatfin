# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bluefin-float
# description will be included in the image's metadata
description: A bit opinionated distro made by Float. Bluefin DX on the latest stream.
alt-tags:
  - canary
  - latest

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bluefin-dx
image-version: latest # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - from-file: features/ublue-bluefin-features.yml
  - type: gschema-overrides  # Override Bluefin's overrides of Gnome default fonts
    include:
      - zz42-ublue-bluefin.gschema.override
  - type: script
    env:
      UBLUE_WALLPAPER: bluefin-woof.png
    scripts:
      - set-default-wallpaper.sh