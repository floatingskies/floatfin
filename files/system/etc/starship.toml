# Floatfin starship prompt (loaded via /etc/fish/conf.d/floatfin.fish in fish,
# or `eval "$(starship init bash)"` in bash). Short, colourful, clickable paths.
add_newline = true
scan_for_worktrees = true

format = """\
[╭─](fg:#5ebede)$username$hostname$directory$git_branch$git_status$package\
[├─](fg:#5ebede)$os$container$cmd_duration$line_break\
[╰─❯](fg:#5ebede)$character"""

[character]
success_symbol = "[❯](fg:#5ebede)"
error_symbol = "[❯](fg:#f5a97f)"

[username]
show_always = false
style_user = "bold fg:#f5a97f"
style_root = "bold red"

[hostname]
format = "[@$hostname](fg:#8aadf4) "
style = "bold"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "fg:#c6a0f6"
truncation_length = 4

[git_branch]
symbol = " "

[git_status]
format = "[\\[$all_status$ahead_behind\\]]($style) "

[package]
disabled = true

[cmd_duration]
min_time = 2_000
show_milliseconds = false
format = " took [${duration}](fg:#eed49f) "

[rust]
disabled = true

[python]
disabled = true

[nodejs]
disabled = true

[os]
disabled = false
format = "[$symbol]($style) "

[container]
disabled = false
format = "[$symbol$name]($style) "
symbol = "[ (podman) ]"