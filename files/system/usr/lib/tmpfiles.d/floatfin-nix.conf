# Backing store for the Nix bind mount on the immutable root
# (floatfin-nix.mount binds /var/lib/nix onto /nix every boot).
d /var/lib/nix 0755 root root -
# The daemon-socket parent must exist before systemd can bind the
# nix-daemon.socket listening socket, otherwise the client can't reach the
# daemon and falls back to a per-user chroot store (which breaks on Atomic,
# where /home is a symlink to /var/home).
d /var/lib/nix/store 0755 root root -
d /var/lib/nix/var/nix/daemon-socket 0755 root root -